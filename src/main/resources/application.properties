# FitTrack Application Configuration
server.port=8080
spring.application.name=fittrack

# Default Database Configuration: H2 with MySQL Compatibility Mode & Local Disk Persistence
spring.datasource.url=jdbc:h2:file:./data/fittrack;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Web Console (accessible at /h2-console for inspection)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# File Upload Settings (for profile picture & attachments)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
