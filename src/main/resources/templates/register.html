<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - FitTrack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex flex-column justify-content-between min-vh-100">

<div th:replace="~{fragments/navbar :: navbar('register')}"></div>
<div th:replace="~{fragments/navbar :: alerts}"></div>

<div class="container my-auto py-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card-dark p-4 p-md-5 shadow-lg">
        <div class="text-center mb-4">
          <div class="d-inline-flex p-3 rounded-circle mb-3" style="background: rgba(204, 255, 0, 0.15);">
            <i class="bi bi-person-plus text-accent fs-2"></i>
          </div>
          <h3 class="fw-bold text-white mb-1">Create Member Account</h3>
          <p class="text-muted small">Begin tracking workouts and competing in challenges</p>
        </div>

        <form th:action="@{/register}" method="post">
          <div class="mb-3">
            <label for="fullName" class="form-label text-light small fw-semibold">Full Name</label>
            <input type="text" id="fullName" name="fullName" class="form-control form-control-dark" placeholder="e.g. John Doe" required>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label for="username" class="form-label text-light small fw-semibold">Username</label>
              <input type="text" id="username" name="username" class="form-control form-control-dark" placeholder="e.g. johndoe" required>
            </div>
            <div class="col-md-6">
              <label for="email" class="form-label text-light small fw-semibold">Email Address</label>
              <input type="email" id="email" name="email" class="form-control form-control-dark" placeholder="e.g. john@example.com" required>
            </div>
          </div>

          <div class="mb-4">
            <label for="password" class="form-label text-light small fw-semibold">Password</label>
            <input type="password" id="password" name="password" class="form-control form-control-dark" placeholder="Choose a secure password" minlength="6" required>
            <small class="text-muted">Minimum 6 characters with secure BCrypt hashing.</small>
          </div>

          <button type="submit" class="btn btn-accent w-100 py-2 mb-3 fw-bold">
            Create Account <i class="bi bi-arrow-right ms-1"></i>
          </button>
        </form>

        <div class="text-center mt-3">
          <span class="text-muted small">Already have an account? </span>
          <a th:href="@{/login}" class="text-accent small fw-bold text-decoration-none">Sign In</a>
        </div>
      </div>
    </div>
  </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
