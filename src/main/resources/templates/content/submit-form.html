<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submit Fitness Content - FitTrack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('articles')}"></div>
<div th:replace="~{fragments/navbar :: alerts}"></div>

<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card-dark p-4 p-md-5">
        <div class="d-flex align-items-center justify-content-between mb-4 pb-2 border-bottom border-secondary">
          <div>
            <h3 class="fw-bold text-white mb-1"><i class="bi bi-pencil-square text-accent me-2"></i> Submit Fitness Article</h3>
            <p class="text-muted small mb-0">Share your workouts, science tips, or nutrition protocols for admin review.</p>
          </div>
          <a th:href="@{/articles}" class="btn btn-outline-light btn-sm">&larr; Back to Guides</a>
        </div>

        <form th:action="@{/content/submit}" method="post">
          <div class="mb-3">
            <label for="title" class="form-label text-light small fw-semibold">Article Title</label>
            <input type="text" id="title" name="title" class="form-control form-control-dark" placeholder="e.g. Master the Barbell Back Squat: Cues & Mobility" required>
          </div>

          <div class="mb-3">
            <label for="category" class="form-label text-light small fw-semibold">Category</label>
            <select id="category" name="category" class="form-select form-select-dark" required>
              <option value="Workout Guide">Workout Guide</option>
              <option value="Nutrition & Diet">Nutrition & Diet</option>
              <option value="Recovery & Sleep">Recovery & Sleep</option>
              <option value="Motivational">Motivational & Mindset</option>
              <option value="Fitness Tips">Fitness Tips & Hacks</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="summary" class="form-label text-light small fw-semibold">Brief Summary (1-2 sentences)</label>
            <textarea id="summary" name="summary" rows="2" class="form-control form-control-dark" placeholder="A concise abstract of the core principle or actionable advice discussed." required></textarea>
          </div>

          <div class="mb-4">
            <label for="bodyContent" class="form-label text-light small fw-semibold">Full Article Content</label>
            <textarea id="bodyContent" name="bodyContent" rows="8" class="form-control form-control-dark" placeholder="Write your full guide here. Detail workout routines, rep schemes, nutrient breakdowns, or training strategies." required></textarea>
          </div>

          <div class="d-flex justify-content-end gap-2">
            <a th:href="@{/articles}" class="btn btn-outline-light">Cancel</a>
            <button type="submit" class="btn btn-accent fw-bold px-4">Submit for Review</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
