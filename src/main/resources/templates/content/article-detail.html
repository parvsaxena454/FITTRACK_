<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${article.title + ' - FitTrack'}">Article Detail - FitTrack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('articles')}"></div>
<div th:replace="~{fragments/navbar :: alerts}"></div>

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <a th:href="@{/articles}" class="btn btn-outline-light btn-sm mb-4">&larr; Back to Guides</a>

      <div class="card-dark p-4 p-md-5">
        <div class="d-flex align-items-center gap-2 mb-3">
          <span class="badge badge-neon" th:text="${article.category}">Category</span>
          <span class="text-muted small">&bull;</span>
          <span class="text-muted small" th:text="${#temporals.format(article.submittedAt, 'MMMM dd, yyyy')}">Date</span>
        </div>

        <h1 class="fw-bold text-white mb-3" th:text="${article.title}">Article Title</h1>

        <div class="d-flex align-items-center gap-3 p-3 rounded bg-dark-700 border border-secondary mb-4">
          <div style="width: 44px; height: 44px; border-radius: 50%; background: #1e293b; border: 2px solid #ccff00; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #ccff00; font-size: 1.2rem;">
            <span th:text="${#strings.substring(article.author.fullName, 0, 1)}">A</span>
          </div>
          <div>
            <div class="fw-bold text-white" th:text="${article.author.fullName}">Author Name</div>
            <small class="text-muted" th:text="${article.author.bio != null ? article.author.bio : 'Fitness Member'}">Bio</small>
          </div>
        </div>

        <div class="lead text-light mb-4 p-3 border-start border-4 border-info bg-dark-700 rounded-end fst-italic" th:text="${article.summary}">
          Summary callout
        </div>

        <div class="text-light fs-6 lh-lg mb-5" style="white-space: pre-line;" th:text="${article.bodyContent}">
          Full body content
        </div>

        <div class="border-top pt-4 d-flex justify-content-between align-items-center" style="border-color: #273549 !important;">
          <a th:href="@{/articles}" class="btn btn-outline-accent btn-sm">&larr; Read More Articles</a>
          <div th:if="${article.reviewedBy != null}" class="small text-muted">
            <i class="bi bi-shield-check text-success me-1"></i> Verified by FitTrack Editorial
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
