<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set Goal - FitTrack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('goals')}"></div>
<div th:replace="~{fragments/navbar :: alerts}"></div>

<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card-dark p-4 p-md-5">
        <div class="d-flex align-items-center justify-content-between mb-4 pb-2 border-bottom border-secondary">
          <div>
            <h3 class="fw-bold text-white mb-1"><i class="bi bi-flag-fill text-accent me-2"></i> Set New Fitness Goal</h3>
            <p class="text-muted small mb-0">Define target values and timelines to measure your progression.</p>
          </div>
          <a th:href="@{/goals}" class="btn btn-outline-light btn-sm">&larr; Back to Goals</a>
        </div>

        <form th:action="@{/goals/new}" method="post">
          <div class="mb-3">
            <label for="title" class="form-label text-light small fw-semibold">Goal Title</label>
            <input type="text" id="title" name="title" class="form-control form-control-dark" placeholder="e.g. Reach 72 kg Target Weight" required>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label for="category" class="form-label text-light small fw-semibold">Goal Category</label>
              <select id="category" name="category" class="form-select form-select-dark" required>
                <option value="Weight Loss">Weight Loss / Cutting</option>
                <option value="Muscle Gain">Muscle Gain / Hypertrophy</option>
                <option value="Running Distance">Running / Distance</option>
                <option value="Weekly Workouts">Weekly Workout Adherence</option>
                <option value="Powerlifting">Powerlifting Strength</option>
                <option value="Calorie Burn">Calorie Expenditure</option>
                <option value="Daily Steps">Daily Steps</option>
              </select>
            </div>
            <div class="col-md-6">
              <label for="unit" class="form-label text-light small fw-semibold">Measurement Unit</label>
              <input type="text" id="unit" name="unit" class="form-control form-control-dark" placeholder="e.g. kg, km, reps, sessions, kcal" value="kg" required>
            </div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label for="currentValue" class="form-label text-light small fw-semibold">Starting / Current Value</label>
              <input type="number" step="any" id="currentValue" name="currentValue" class="form-control form-control-dark" placeholder="e.g. 78" required>
            </div>
            <div class="col-md-6">
              <label for="targetValue" class="form-label text-light small fw-semibold">Target Value</label>
              <input type="number" step="any" id="targetValue" name="targetValue" class="form-control form-control-dark" placeholder="e.g. 72" required>
            </div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label for="startDate" class="form-label text-light small fw-semibold">Start Date</label>
              <input type="date" id="startDate" name="startDate" class="form-control form-control-dark" th:value="${today}">
            </div>
            <div class="col-md-6">
              <label for="targetDate" class="form-label text-light small fw-semibold">Target Completion Date</label>
              <input type="date" id="targetDate" name="targetDate" class="form-control form-control-dark" th:value="${defaultTargetDate}" required>
            </div>
          </div>

          <div class="mb-4">
            <label for="description" class="form-label text-light small fw-semibold">Strategy & Motivation Notes</label>
            <textarea id="description" name="description" rows="3" class="form-control form-control-dark" placeholder="e.g. Calorie deficit of 300 kcal/day, 4 strength sessions and 1 endurance run weekly."></textarea>
          </div>

          <div class="d-flex justify-content-end gap-2">
            <a th:href="@{/goals}" class="btn btn-outline-light">Cancel</a>
            <button type="submit" class="btn btn-accent fw-bold px-4">Establish Goal</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
