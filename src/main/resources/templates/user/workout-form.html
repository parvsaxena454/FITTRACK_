<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log Workout - FitTrack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('workouts')}"></div>
<div th:replace="~{fragments/navbar :: alerts}"></div>

<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card-dark p-4 p-md-5">
        <div class="d-flex align-items-center justify-content-between mb-4 pb-2 border-bottom border-secondary">
          <div>
            <h3 class="fw-bold text-white mb-1"><i class="bi bi-plus-circle text-accent me-2"></i> Log New Workout</h3>
            <p class="text-muted small mb-0">Enter your exercise details to update your metrics and charts.</p>
          </div>
          <a th:href="@{/workouts}" class="btn btn-outline-light btn-sm">&larr; Back to Log</a>
        </div>

        <form th:action="@{/workouts/new}" method="post">
          <div class="mb-3">
            <label for="title" class="form-label text-light small fw-semibold">Workout Title</label>
            <input type="text" id="title" name="title" class="form-control form-control-dark" placeholder="e.g. Heavy Leg Day & Squats" required>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label for="workoutType" class="form-label text-light small fw-semibold">Category / Sport</label>
              <select id="workoutType" name="workoutType" class="form-select form-select-dark" required>
                <option value="Strength">Strength Training</option>
                <option value="Cardio">Cardio / Running</option>
                <option value="Cycling">Cycling</option>
                <option value="HIIT">HIIT & Circuit</option>
                <option value="Yoga">Yoga & Mobility</option>
                <option value="Swimming">Swimming</option>
                <option value="Calisthenics">Calisthenics / Bodyweight</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="col-md-6">
              <label for="intensity" class="form-label text-light small fw-semibold">Intensity Level</label>
              <select id="intensity" name="intensity" class="form-select form-select-dark" required>
                <option value="MEDIUM" selected>Medium (Aerobic / Moderate Effort)</option>
                <option value="HIGH">High (Maximum Effort / Heavy Lift / Sprint)</option>
                <option value="LOW">Low (Recovery / Light Mobility)</option>
              </select>
            </div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-4">
              <label for="durationMinutes" class="form-label text-light small fw-semibold">Duration (Minutes)</label>
              <input type="number" id="durationMinutes" name="durationMinutes" class="form-control form-control-dark" min="1" max="600" value="45" required>
            </div>
            <div class="col-md-4">
              <label for="caloriesBurned" class="form-label text-light small fw-semibold">Calories Burned (kcal)</label>
              <input type="number" id="caloriesBurned" name="caloriesBurned" class="form-control form-control-dark" min="0" max="5000" value="350" required>
            </div>
            <div class="col-md-4">
              <label for="workoutDate" class="form-label text-light small fw-semibold">Date</label>
              <input type="date" id="workoutDate" name="workoutDate" class="form-control form-control-dark" th:value="${today}" required>
            </div>
          </div>

          <div class="mb-4">
            <label for="notes" class="form-label text-light small fw-semibold">Exercises, Sets & Performance Notes</label>
            <textarea id="notes" name="notes" rows="3" class="form-control form-control-dark" placeholder="e.g. Squats: 4 sets of 8 reps @ 100kg. Felt energized throughout."></textarea>
          </div>

          <div class="d-flex justify-content-end gap-2">
            <a th:href="@{/workouts}" class="btn btn-outline-light">Cancel</a>
            <button type="submit" class="btn btn-accent fw-bold px-4">Save Workout Log</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
