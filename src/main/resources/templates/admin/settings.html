<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Settings - FitTrack Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('admin')}"></div>
<div th:replace="~{fragments/navbar :: alerts}"></div>

<div class="container-fluid px-lg-5 py-4">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
    <div>
      <a th:href="@{/admin/dashboard}" class="btn btn-outline-light btn-sm mb-2">&larr; Back to Admin Center</a>
      <h2 class="fw-bold text-white mb-0"><i class="bi bi-gear-fill text-accent me-2"></i> System Configuration Parameters</h2>
      <p class="text-muted small mb-0">Manage global application flags, announcements, and operational thresholds.</p>
    </div>
  </div>

  <div class="row g-4">
    <!-- Active Settings List -->
    <div class="col-lg-7">
      <div class="card-dark">
        <div class="card-dark-header p-3">
          <h5 class="fw-bold text-white mb-0">Active System Settings</h5>
        </div>
        <div class="p-3">
          <div th:each="s : ${settings}" class="p-3 rounded bg-dark-700 border border-secondary mb-3">
            <form th:action="@{/admin/settings}" method="post">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <code class="text-accent fs-6 fw-bold" th:text="${s.settingKey}">KEY</code>
                <small class="text-muted">Updated: <span th:text="${#temporals.format(s.updatedAt, 'MMM dd, HH:mm')}">Time</span></small>
              </div>

              <input type="hidden" name="settingKey" th:value="${s.settingKey}">

              <div class="mb-2">
                <input type="text" name="settingValue" class="form-control form-control-dark" th:value="${s.settingValue}" required>
              </div>

              <div class="d-flex justify-content-between align-items-center">
                <small class="text-muted" th:text="${s.description}">Description text</small>
                <button type="submit" class="btn btn-sm btn-accent fw-semibold">Save</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Add / Overwrite Setting Card -->
    <div class="col-lg-5">
      <div class="card-dark p-4">
        <h4 class="fw-bold text-white mb-3 pb-2 border-bottom border-secondary">
          <i class="bi bi-sliders text-accent me-2"></i> Add / Override Parameter
        </h4>

        <form th:action="@{/admin/settings}" method="post">
          <div class="mb-3">
            <label for="newKey" class="form-label text-light small fw-semibold">Setting Key</label>
            <input type="text" id="newKey" name="settingKey" class="form-control form-control-dark" placeholder="e.g. MOTD_ANNOUNCEMENT" required>
          </div>

          <div class="mb-3">
            <label for="newValue" class="form-label text-light small fw-semibold">Setting Value</label>
            <textarea id="newValue" name="settingValue" rows="3" class="form-control form-control-dark" placeholder="e.g. Welcome to FitTrack! New summer challenge now live!" required></textarea>
          </div>

          <div class="mb-4">
            <label for="newDesc" class="form-label text-light small fw-semibold">Description / Purpose</label>
            <input type="text" id="newDesc" name="description" class="form-control form-control-dark" placeholder="e.g. Broadcast message shown on user dashboard banner">
          </div>

          <button type="submit" class="btn btn-accent fw-bold w-100 py-2">
            Save System Setting
          </button>
        </form>
      </div>
    </div>
  </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
