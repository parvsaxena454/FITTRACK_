<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Users - FitTrack Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('admin')}"></div>
<div th:replace="~{fragments/navbar :: alerts}"></div>

<div class="container-fluid px-lg-5 py-4">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
    <div>
      <a th:href="@{/admin/dashboard}" class="btn btn-outline-light btn-sm mb-2">&larr; Back to Admin Center</a>
      <h2 class="fw-bold text-white mb-0"><i class="bi bi-people-fill text-primary me-2"></i> Registered User Management</h2>
      <p class="text-muted small mb-0">Inspect user accounts, manage security roles, and suspend/reactivate access.</p>
    </div>
    <span class="badge badge-neon fs-6" th:text="${#lists.size(users) + ' Total Registered Users'}">Total Users</span>
  </div>

  <div class="card-dark">
    <div class="table-responsive">
      <table class="table table-dark-custom mb-0">
        <thead>
          <tr>
            <th>User</th>
            <th>Role</th>
            <th>Status</th>
            <th>Fitness Level</th>
            <th>Workouts</th>
            <th>Registered On</th>
            <th class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="u : ${users}">
            <td>
              <div class="d-flex align-items-center gap-3">
                <div style="width: 38px; height: 38px; border-radius: 50%; background: #1e293b; border: 2px solid #38bdf8; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #38bdf8;">
                  <span th:text="${#strings.substring(u.fullName, 0, 1)}">U</span>
                </div>
                <div>
                  <strong class="text-white" th:text="${u.fullName}">User Name</strong>
                  <div class="small text-muted" th:text="${'@' + u.username + ' &bull; ' + u.email}">@username &bull; email</div>
                </div>
              </div>
            </td>
            <td>
              <span th:if="${u.role == 'ROLE_ADMIN'}" class="badge bg-danger">ADMIN</span>
              <span th:if="${u.role == 'ROLE_USER'}" class="badge bg-secondary">MEMBER</span>
            </td>
            <td>
              <span th:if="${u.enabled}" class="badge bg-success"><i class="bi bi-check-circle me-1"></i> ACTIVE</span>
              <span th:if="${!u.enabled}" class="badge bg-danger"><i class="bi bi-slash-circle me-1"></i> SUSPENDED</span>
            </td>
            <td>
              <span class="badge badge-neon" th:text="${u.fitnessLevel != null ? u.fitnessLevel : 'Beginner'}">Level</span>
            </td>
            <td>
              <span class="fw-bold text-light" th:text="${#lists.size(u.workouts)}">5</span>
            </td>
            <td th:text="${#temporals.format(u.createdAt, 'MMM dd, yyyy')}">Date</td>
            <td class="text-end">
              <div class="d-inline-flex gap-2">
                <!-- Toggle Status Button -->
                <form th:action="@{/admin/users/{id}/toggle-status(id=${u.id})}" method="post" class="d-inline">
                  <button type="submit" class="btn btn-sm" th:classappend="${u.enabled ? 'btn-outline-danger' : 'btn-outline-success'}">
                    <span th:if="${u.enabled}"><i class="bi bi-person-x-fill me-1"></i> Suspend</span>
                    <span th:if="${!u.enabled}"><i class="bi bi-person-check-fill me-1"></i> Activate</span>
                  </button>
                </form>

                <!-- Role Switcher Form -->
                <form th:action="@{/admin/users/{id}/role(id=${u.id})}" method="post" class="d-inline">
                  <input type="hidden" name="role" th:value="${u.role == 'ROLE_ADMIN' ? 'ROLE_USER' : 'ROLE_ADMIN'}">
                  <button type="submit" class="btn btn-sm btn-outline-warning" th:title="${u.role == 'ROLE_ADMIN' ? 'Demote to Member' : 'Promote to Admin'}">
                    <i class="bi bi-arrow-left-right me-1"></i> Role
                  </button>
                </form>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
