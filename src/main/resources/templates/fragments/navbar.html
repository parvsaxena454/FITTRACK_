<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<!-- Navigation Bar Fragment -->
<nav th:fragment="navbar(activeTab)" class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
  <div class="container-fluid px-lg-5">
    <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}">
      <div style="width: 38px; height: 38px; background: #ccff00; border-radius: 8px; display: flex; align-items: center; justify-content: center;">
        <i class="bi bi-activity text-dark fs-4 fw-bold"></i>
      </div>
      <span class="brand-logo">FIT<span>TRACK</span></span>
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain"
            aria-controls="navbarMain" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarMain">
      <!-- Member Links -->
      <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4 gap-lg-1" sec:authorize="isAuthenticated()">
        <li class="nav-item">
          <a class="nav-link" th:classappend="${activeTab == 'dashboard' ? 'active' : ''}" th:href="@{/dashboard}">
            <i class="bi bi-grid-1x2-fill me-1"></i> Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:classappend="${activeTab == 'workouts' ? 'active' : ''}" th:href="@{/workouts}">
            <i class="bi bi-heart-pulse-fill me-1"></i> Workouts
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:classappend="${activeTab == 'goals' ? 'active' : ''}" th:href="@{/goals}">
            <i class="bi bi-bullseye me-1"></i> Goals
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:classappend="${activeTab == 'challenges' ? 'active' : ''}" th:href="@{/challenges}">
            <i class="bi bi-trophy-fill me-1"></i> Challenges
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:classappend="${activeTab == 'articles' ? 'active' : ''}" th:href="@{/articles}">
            <i class="bi bi-journal-richtext me-1"></i> Community Content
          </a>
        </li>
      </ul>

      <!-- Public Links if not logged in -->
      <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4 gap-lg-1" sec:authorize="isAnonymous()">
        <li class="nav-item">
          <a class="nav-link" th:href="@{/}">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/articles}">Fitness Articles</a>
        </li>
      </ul>

      <!-- User or Auth Section -->
      <div class="d-flex align-items-center gap-3">
        <!-- Admin Panel Quick Link -->
        <div sec:authorize="hasRole('ADMIN')">
          <a th:href="@{/admin/dashboard}" class="btn btn-sm btn-outline-danger fw-bold d-flex align-items-center gap-1">
            <i class="bi bi-shield-lock-fill"></i> Admin Panel
          </a>
        </div>

        <div sec:authorize="isAuthenticated()" class="dropdown">
          <a href="#" class="d-flex align-items-center gap-2 text-decoration-none dropdown-toggle text-light"
             id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
            <div style="width: 36px; height: 36px; border-radius: 50%; background: #1e293b; border: 2px solid #ccff00; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #ccff00;">
              <span sec:authentication="name" th:text="${#strings.substring(#authentication.name,0,1).toUpperCase()}">U</span>
            </div>
            <span class="d-none d-md-inline fw-semibold" sec:authentication="name">User</span>
          </a>
          <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end shadow-lg" aria-labelledby="userDropdown" style="background-color: #0f172a; border-color: #273549; min-width: 200px;">
            <li class="px-3 py-2 border-bottom border-secondary mb-1">
              <div class="fw-bold text-light" sec:authentication="name">Username</div>
              <small class="text-accent" sec:authorize="hasRole('ADMIN')">Administrator</small>
              <small class="text-muted" sec:authorize="hasRole('USER')">Fitness Member</small>
            </li>
            <li>
              <a class="dropdown-item py-2" th:href="@{/profile}">
                <i class="bi bi-person-fill me-2 text-muted"></i> Profile & Metrics
              </a>
            </li>
            <li>
              <a class="dropdown-item py-2" th:href="@{/content/my-submissions}">
                <i class="bi bi-file-earmark-text me-2 text-muted"></i> My Submissions
              </a>
            </li>
            <li><hr class="dropdown-divider border-secondary my-1"></li>
            <li>
              <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="dropdown-item py-2 text-danger">
                  <i class="bi bi-box-arrow-right me-2"></i> Log Out
                </button>
              </form>
            </li>
          </ul>
        </div>

        <div sec:authorize="isAnonymous()" class="d-flex align-items-center gap-2">
          <a th:href="@{/login}" class="btn btn-outline-accent btn-sm px-3">Sign In</a>
          <a th:href="@{/register}" class="btn btn-accent btn-sm px-3">Register</a>
        </div>
      </div>
    </div>
  </div>
</nav>

<!-- Reusable Flash Alerts Fragment -->
<div th:fragment="alerts" class="container-fluid px-lg-5 pt-3">
  <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show d-flex align-items-center gap-2 card-dark text-light border-success" role="alert" style="background: rgba(16, 185, 129, 0.15); border-left: 5px solid #10b981;">
    <i class="bi bi-check-circle-fill text-success fs-5"></i>
    <div th:text="${successMessage}">Operation completed successfully.</div>
    <button type="button" class="btn-close btn-close-white ms-auto" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>
  <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center gap-2 card-dark text-light border-danger" role="alert" style="background: rgba(239, 68, 68, 0.15); border-left: 5px solid #ef4444;">
    <i class="bi bi-exclamation-triangle-fill text-danger fs-5"></i>
    <div th:text="${errorMessage}">An error occurred.</div>
    <button type="button" class="btn-close btn-close-white ms-auto" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>
</div>

</body>
</html>
